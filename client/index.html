    <!-- ——————————————————————————————————————————————————————————
         PRELOADER — ugrađen u HTML (ne čeka ni CSS ni JS bundle),
         pa se brendirani ekran vidi od prvog iscrtavanja.
         Sklanja ga src/lib/preloader.js pozivom window.__aamReady().
         —————————————————————————————————————————————————————————— -->
    <style>
      .aam-loading,
      .aam-loading body {
        overflow: hidden;
      }
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.25rem;
        background: #0b0b0d;
        color: #f2efe8;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      /* crvena svjetlosna mrlja — isti motiv kao hero */
      #preloader::before {
        content: "";
        position: absolute;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        background: #ff3b2f;
        opacity: 0.16;
        filter: blur(110px);
      }
      .pl-dial {
        position: relative;
        display: grid;
        place-items: center;
        width: 190px;
        height: 190px;
      }
      .pl-dial i {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid #2a2a30;
      }
      .pl-dial i:nth-child(2) {
        inset: 18px;
        border-style: dashed;
        animation: pl-spin 9s linear infinite;
      }
      .pl-dial i:nth-child(3) {
        inset: -1px;
        border: 2px solid transparent;
        border-top-color: #ff3b2f;
        animation: pl-spin 1.1s linear infinite;
      }
      .pl-clock {
        position: relative;
        margin: 0;
        font-size: 2.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }
      .pl-clock span {
        color: #ff3b2f;
        animation: pl-blink 1s steps(1) infinite;
      }
      .pl-bar {
        position: relative;
        width: 190px;
        height: 2px;
        background: #2a2a30;
        overflow: hidden;
      }
      .pl-bar i {
        display: block;
        width: 4%;
        height: 100%;
        background: #f2efe8;
        animation: pl-fill 2.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #preloader.is-ready .pl-bar i {
        width: 100%;
        animation: none;
        transition: width 0.22s linear;
      }
      .pl-tag {
        position: relative;
        margin: 0;
        font-size: 0.625rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #8c8a85;
      }
      @keyframes pl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pl-blink {
        50% {
          opacity: 0;
        }
      }
      @keyframes pl-fill {
        to {
          width: 92%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader *,
        #preloader::before {
          animation: none !important;
        }
        .pl-bar i {
          width: 100%;
        }
      }
    </style>
    <noscript>
      <style>
        #preloader {
          display: none !important;
        }
      </style>
    </noscript>
    <script>
      // Zaključa skrol i otvori prozor za sklanjanje preloadera.
      // Sigurnosna brana od 5s: sajt nikad ne ostane zaglavljen ispod njega.
      ;(function () {
        var root = document.documentElement
        root.className += ' aam-loading'

        var seen = false
        try {
          seen = sessionStorage.getItem('aam-seen') === '1'
        } catch (e) {}

        var MIN = seen ? 0 : 900 // prvi put u sesiji preloader stoji najmanje 0.9s
        var start = Date.now()
        var done = false

        function finish() {
          if (done) return
          done = true
          try {
            sessionStorage.setItem('aam-seen', '1')
          } catch (e) {}

          setTimeout(function () {
            var el = document.getElementById('preloader')
            if (el) el.className += ' is-ready' // traka doskoči na 100%
            setTimeout(function () {
              root.className = root.className.replace(' aam-loading', '')
              if (!el) return
              el.className += ' is-done'
              setTimeout(function () {
                el.remove()
              }, 700)
            }, 220)
          }, Math.max(0, MIN - (Date.now() - start)))
        }

        window.__aamReady = finish
        setTimeout(finish, 5000)
      })()
    </script>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Sajt se učitava">
      <div class="pl-dial">
        <i></i><i></i><i></i>
        <p class="pl-clock">02<span>:</span>00</p>
      </div>
      <div class="pl-bar"><i></i></div>
      <p class="pl-tag">Same city, different thoughts</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
